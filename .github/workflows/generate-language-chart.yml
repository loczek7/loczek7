name: Generate Language Chart

on:
  schedule:
    - cron: "45 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: main-checkout

      - name: Checkout output branch
        uses: actions/checkout@v4
        with:
          ref: output
          path: output-checkout

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate language pie chart
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        working-directory: main-checkout
        run: node .github/scripts/language-pie.mjs

      - name: Copy chart into output checkout
        run: cp main-checkout/dist/language-pie.svg output-checkout/language-pie.svg

      - name: Commit and push
        working-directory: output-checkout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add language-pie.svg
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Update language pie chart"
          git push origin output
